<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DUKETENNIS | Accra Tennis Club</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Auth Screen -->
  <div id="authScreen">
    <div class="auth-card">
      <h1>DUKETENNIS</h1>
      <p class="subtitle">Rolider Sports Complex · Accra</p>

      <!-- Sign In Form -->
      <div id="signInForm" class="email-signin-form">
        <input type="email" id="emailInput" placeholder="Email address" required />
        <input type="password" id="passwordInput" placeholder="Password" required />
        <button class="btn-primary" id="signInBtn">Sign In</button>
        <p class="auth-links">
          <a id="showSignUp">Create account</a> · 
          <a id="showReset">Forgot password?</a>
        </p>
      </div>

      <!-- Sign Up Form -->
      <div id="signUpForm" class="email-signin-form" style="display:none;">
        <input type="text" id="signUpName" placeholder="Full name" required />
        <input type="email" id="signUpEmail" placeholder="Email address" required />
        <input type="password" id="signUpPassword" placeholder="Password (min 6 characters)" required />
        <button class="btn-primary" id="signUpBtn">Create Account</button>
        <p class="auth-links">
          <a id="showSignInFromSignUp">Already have an account? Sign in</a>
        </p>
      </div>

      <!-- Reset Password Form -->
      <div id="resetForm" class="email-signin-form" style="display:none;">
        <input type="email" id="resetEmail" placeholder="Email address" required />
        <button class="btn-primary" id="resetBtn">Send Reset Email</button>
        <p class="auth-links">
          <a id="showSignInFromReset">Back to sign in</a>
        </p>
      </div>
    </div>
  </div>

  <!-- Onboarding Overlay -->
  <div id="onboardingOverlay" style="display:none;">
    <div class="onboarding-card">
      <h2 style="margin-bottom:16px;">Complete Your Profile</h2>
      <p style="font-size:0.9rem;color:var(--gray-600);margin-bottom:12px;">Please set your gender and a unique username.</p>
      <label>Gender</label>
      <select id="genderInput">
        <option value="">Select gender</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
      </select>
      <label>Username</label>
      <input type="text" id="usernameInput" placeholder="Username" />
      <button class="btn-primary" id="saveUsernameBtn" style="width:100%;">Save</button>
      <p id="usernameError" style="color:var(--red);font-size:0.8rem;margin-top:8px;"></p>
    </div>
  </div>

  <!-- App Screen -->
  <div id="appScreen">
    <div class="top-bar">
      <h2 id="pageTitle">Dashboard</h2>
      <button class="logout-btn" id="logoutBtn">Sign Out</button>
    </div>
    <div id="mainContent"></div>
  </div>

  <!-- Bottom Nav -->
  <nav class="bottom-nav" id="bottomNav">
    <button class="nav-btn active" data-screen="dashboard">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
      <span>Home</span>
    </button>
    <button class="nav-btn" data-screen="booking">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
      <span>Book</span>
    </button>
    <button class="nav-btn" data-screen="bookings">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg>
      <span>Bookings</span>
    </button>
    <button class="nav-btn" data-screen="announcements">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5.882V19.24a1.76 1.76 0 01-3.417.592l-2.147-6.15M18 13a3 3 0 100-6M5.436 13.683A4.001 4.001 0 017 6h1.832c4.1 0 7.625-1.234 9.168-3v14c-1.543-1.766-5.067-3-9.168-3H7a3.988 3.988 0 01-1.564-.317z"/></svg>
      <span>News</span>
    </button>
    <button class="nav-btn" data-screen="rankings">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/></svg>
      <span>Rankings</span>
    </button>
    <button class="nav-btn" data-screen="messages">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/></svg>
      <span>Chat</span>
    </button>
  </nav>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <script src="script.js"></script>
</body>
</html>
