<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DUKETENNIS | Accra Tennis Club</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Chart.js for analytics -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
  <!-- Auth Screen -->
  <div id="authScreen">
    <div class="auth-card">
      <h1>DUKETENNIS</h1>
      <p class="subtitle">Rolider Sports Complex · Accra</p>
      <button class="btn-primary pill" id="googleSignInBtn">
        <svg width="20" height="20" viewBox="0 0 24 24">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Sign in with Google
      </button>
      <p class="policy-note">By continuing you agree to booking & cancellation policy.</p>
    </div>
  </div>

 <!-- Onboarding Overlay -->
<div id="onboardingOverlay" style="display:none;">
  <div class="onboarding-card">
    <h2>Complete Your Profile</h2>
    <p>Set your gender, username, member ID, and optionally a profile picture.</p>
    <label>Gender</label>
    <select id="genderInput">
      <option value="">Select gender</option>
      <option value="Male">Male</option>
      <option value="Female">Female</option>
    </select>
    <label>Username</label>
    <input type="text" id="usernameInput" placeholder="Username" />
    <label>Member ID (unique)</label>
    <input type="text" id="memberIdInput" placeholder="e.g., DT001" />
    <label>Profile Picture (optional)</label>
    <input type="file" id="profilePicInput" accept="image/*" />
    <button class="btn-primary pill" id="saveUsernameBtn">Save</button>
    <p id="usernameError" style="color:var(--red);font-size:0.8rem;margin-top:8px;"></p>
  </div>


  <!-- App Screen -->
  <div id="appScreen">
    <div class="top-bar">
      <h2 id="pageTitle">Dashboard</h2>
      <div style="display:flex; gap:8px;">
        <button class="logout-btn pill" id="themeToggleBtn">🌓</button>
        <button class="logout-btn pill" id="logoutBtn">Sign Out</button>
      </div>
    </div>
    <div id="mainContent"></div>
  </div>

  <!-- Bottom Nav -->
  <nav class="bottom-nav" id="bottomNav">
    <button class="nav-btn active" data-screen="dashboard">🏠<span>Home</span></button>
    <button class="nav-btn" data-screen="booking">📅<span>Book</span></button>
    <button class="nav-btn" data-screen="bookings">📋<span>Bookings</span></button>
    <button class="nav-btn" data-screen="announcements">📢<span>News</span></button>
    <button class="nav-btn" data-screen="alerts">🔔<span>Alerts</span></button>
    <button class="nav-btn" data-screen="rankings">🏆<span>Rankings</span></button>
    <button class="nav-btn" data-screen="live">🔴<span>Live</span></button>
    <button class="nav-btn" data-screen="messages">💬<span>Chat</span></button>
  </nav>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <script src="script.js"></script>
</body>
</html>
