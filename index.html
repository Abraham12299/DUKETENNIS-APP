<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DUKETENNIS | Accra Tennis Club</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Auth Screen -->
  <div id="authScreen">
    <div class="auth-card">
      <h1>DUKETENNIS</h1>
      <p class="subtitle">Rolider Sports Complex · Accra</p>
      <button class="btn-primary pill" id="googleSignInBtn">
        <svg width="20" height="20" viewBox="0 0 24 24">...</svg>
        Sign in with Google
      </button>
      <p class="policy-note">By continuing you agree to booking & cancellation policy.</p>
    </div>
  </div>

  <!-- Onboarding Overlay -->
  <div id="onboardingOverlay" style="display:none;">
    <div class="onboarding-card">
      <h2>Complete Your Profile</h2>
      <p>Please set your gender and a unique username.</p>
      <label>Gender</label>
      <select id="genderInput">
        <option value="">Select gender</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
      </select>
      <label>Username</label>
      <input type="text" id="usernameInput" placeholder="Username" />
      <button class="btn-primary pill" id="saveUsernameBtn">Save</button>
      <p id="usernameError" style="color:var(--red);font-size:0.8rem;margin-top:8px;"></p>
    </div>
  </div>

  <!-- App Screen -->
  <div id="appScreen">
    <div class="top-bar">
      <h2 id="pageTitle">Dashboard</h2>
      <button class="logout-btn pill" id="logoutBtn">Sign Out</button>
    </div>
    <div id="mainContent"></div>
  </div>

  <!-- Bottom Nav -->
  <nav class="bottom-nav" id="bottomNav">
    <button class="nav-btn active" data-screen="dashboard">🏠<span>Home</span></button>
    <button class="nav-btn" data-screen="booking">📅<span>Book</span></button>
    <button class="nav-btn" data-screen="bookings">📋<span>Bookings</span></button>
    <button class="nav-btn" data-screen="announcements">📢<span>News</span></button>
    <button class="nav-btn" data-screen="alerts">🔔<span>Alerts</span></button>
    <button class="nav-btn" data-screen="rankings">🏆<span>Rankings</span></button>
    <button class="nav-btn" data-screen="messages">💬<span>Chat</span></button>
  </nav>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
  <!-- EmailJS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

  <!-- Main Script -->
  <script src="script.js"></script>
</body>
</html>
